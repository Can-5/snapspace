[package]
name = "snapspace"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Window-workspace profile engine for Orbit: validate saved layouts and plan restores honestly (missing apps, out-of-bounds, refusals). No platform windowing code lives here."
repository = "https://github.com/Can-5/snapspace"
keywords = ["window-manager", "workspace", "orbit"]
categories = ["os::linux-apis"]

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
